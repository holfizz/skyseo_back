limit_req_zone $binary_remote_addr zone=skyseo_landing_leads:1m rate=5r/m;
limit_req_zone $binary_remote_addr zone=skyseo_operator_login:1m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name skyseo.site www.skyseo.site 85.208.85.102;
    client_max_body_size 4k;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/skyseo-acme;
        try_files $uri =404;
    }
    location = /v1/api/lead {
        limit_req zone=skyseo_landing_leads burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4018;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }
    location = /v1/api/health {
        proxy_pass http://127.0.0.1:4018;
    }
    location = /v1/api/auth/login {
        if ($scheme != https) { return 404; }
        client_max_body_size 16k;
        limit_req zone=skyseo_operator_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4019;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
    location ^~ /v1/api/ {
        if ($scheme != https) { return 404; }
        client_max_body_size 64m;
        proxy_pass http://127.0.0.1:4019;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        add_header X-Robots-Tag "noindex" always;
    }
    location = /holfizz {
        if ($scheme != https) { return 404; }
        proxy_pass http://127.0.0.1:3018;
        proxy_set_header Host $host;
        add_header X-Robots-Tag "noindex" always;
    }
    location ^~ /holfizz/ {
        if ($scheme != https) { return 404; }
        proxy_pass http://127.0.0.1:3018;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Robots-Tag "noindex" always;
    }
    location ^~ /api/ { return 404; }
    location ~ ^/(holfizz|admin|manager|cabinet|dashboard|login|register)(/|$) { return 404; }

    location / {
        proxy_pass http://127.0.0.1:3018;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
